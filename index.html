
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f8ff">
<title>Materi Belajar | Genius Kecil</title>

<style>
:root{
  --blue:#15549a;
  --dark:#103f76;
  --bg:#f4f8ff;
  --white:#fff;
  --text:#172b45;
  --muted:#718096;
  --border:#dce6f2;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:5;
}
.header{
  max-width:1120px;
  margin:auto;
  padding:10px 20px;
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  text-decoration:none;
}
.brand img{
  width:48px;
  height:48px;
  object-fit:contain;
}
.brand b{
  display:block;
  color:var(--blue);
  font-size:20px;
}
.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.4px;
  margin-top:3px;
}
.home{
  background:#e8f1ff;
  color:var(--blue);
  padding:11px 16px;
  border-radius:12px;
  text-decoration:none;
  font-weight:bold;
}
main{
  max-width:1120px;
  margin:auto;
  padding:28px 20px 60px;
}
h1{
  color:var(--blue);
  font-size:26px;
  margin:0 0 8px;
}
.subtitle{
  color:var(--muted);
  margin:0 0 24px;
}
.panel,.reader{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:20px;
  margin-bottom:24px;
}
.fields{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:14px;
}
.field label{
  display:block;
  color:var(--dark);
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}
select{
  width:100%;
  height:48px;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fbfdff;
  padding:0 13px;
  color:var(--text);
  font-size:14px;
}
select:focus{
  outline:2px solid #b9d6fa;
}
.section-title{
  color:var(--blue);
  font-size:20px;
  margin:28px 0 7px;
}
.desc{
  font-size:13px;
  color:var(--muted);
  margin:0 0 16px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:13px;
}
.card{
  border:1px solid var(--border);
  background:white;
  border-radius:14px;
  padding:17px;
  text-align:left;
  cursor:pointer;
  min-height:85px;
}
.card:hover{border-color:#7eafe7}
.card strong{
  display:block;
  color:var(--dark);
  font-size:15px;
  line-height:1.5;
}
.card small{
  display:block;
  color:var(--muted);
  margin-top:6px;
  line-height:1.4;
}
.reader h2{
  color:var(--blue);
  margin-top:0;
}
.content{
  line-height:1.8;
  overflow-wrap:anywhere;
}
.content img{
  max-width:100%;
  height:auto;
  border-radius:10px;
}
.content iframe{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:10px;
}
.content video{
  width:100%;
  max-height:500px;
}
.back{
  border:0;
  border-radius:10px;
  padding:10px 15px;
  background:#e8f1ff;
  color:var(--blue);
  font-weight:bold;
  cursor:pointer;
  margin-bottom:18px;
}
.message{
  background:#fff;
  border:1px dashed #b9cce2;
  border-radius:13px;
  padding:22px;
  text-align:center;
  color:var(--muted);
  line-height:1.6;
}
.hidden{display:none!important}
.loading{
  text-align:center;
  padding:25px;
  color:var(--muted);
}
footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  padding:22px;
}
@media(max-width:700px){
  .header{padding:9px 14px}
  .brand img{width:42px;height:42px}
  .brand b{font-size:17px}
  .home{font-size:13px;padding:9px 12px}
  main{padding:22px 15px 45px}
  h1{font-size:23px}
  .fields,.grid{grid-template-columns:1fr}
  .panel{padding:16px}
}
</style>
</head>

<body>

<header>
  <div class="header">
    <a class="brand" href="./">
      <img
        src="https://raw.githubusercontent.com/genius-kecil/genius-kecil-portal/main/logo-genius-kecil.png"
        alt="Genius Kecil"
      >
      <span>
        <b>GENIUS KECIL</b>
        <small>TEMAN BELAJAR KITA</small>
      </span>
    </a>

    <a class="home" href="https://genius-kecil-portal.rt2000-innovation.workers.dev/">
      Beranda
    </a>
  </div>
</header>

<main>

  <h1>Materi Pembelajaran</h1>
  <p class="subtitle">
    Yuk, pilih jenjang pendidikan dan mulai belajar!
  </p>

  <section class="panel">
    <div class="fields">

      <div class="field">
        <label for="jenjang">Jenjang Pendidikan</label>
        <select id="jenjang">
          <option value="">Memuat jenjang...</option>
        </select>
      </div>

      <div class="field hidden" id="kelasBox">
        <label for="kelas">Kelas</label>
        <select id="kelas">
          <option value="">Pilih kelas</option>
        </select>
      </div>

      <div class="field hidden" id="mapelBox">
        <label for="mapel">Mata Pelajaran</label>
        <select id="mapel">
          <option value="">Pilih mata pelajaran</option>
        </select>
      </div>

    </div>
  </section>

  <section id="listing" class="hidden">
    <h2 class="section-title" id="listTitle">Daftar Materi</h2>
    <p class="desc" id="listDesc"></p>
    <div id="list" class="grid"></div>
  </section>

  <section id="reader" class="reader hidden">
    <button class="back" id="back">← Kembali</button>
    <div id="readerContent" class="content"></div>
  </section>

  <div id="status" class="message">
    Menghubungkan ke database materi...
  </div>

</main>

<footer>Genius Kecil · Teman Belajar Kita</footer>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbxB8_JF6PrDj0TLbOff1VYLtfvTQ7w6Pf_xDY8JszolRviRljgNJPcZ9AJPPGZDEQZBXg/exec";

const $ = id => document.getElementById(id);

let dataMateri = [];
let currentItems = [];
let selectedJenjang = "";
let selectedBab = "";
let selectedView = "bab";

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[c]));
}

function status(message){
  $("status").textContent = message;
  $("status").classList.remove("hidden");
}

function hideStatus(){
  $("status").classList.add("hidden");
}

function unique(values){
  return [...new Set(
    values.map(v=>String(v||"").trim()).filter(Boolean)
  )];
}

function fill(id,values,placeholder){
  const el=$(id);
  el.innerHTML="";

  const first=document.createElement("option");
  first.value="";
  first.textContent=placeholder;
  el.appendChild(first);

  values.forEach(value=>{
    const op=document.createElement("option");
    op.value=value;
    op.textContent=value;
    el.appendChild(op);
  });
}

function loadAPI(){
  const callback="gkData_"+Date.now();
  const script=document.createElement("script");

  const timer=setTimeout(()=>{
    delete window[callback];
    script.remove();
    status("Koneksi database terlalu lama. Silakan muat ulang halaman.");
  },20000);

  window[callback]=result=>{
    clearTimeout(timer);
    delete window[callback];
    script.remove();

    if(!result || result.status!=="success"){
      status(result?.message || "Gagal mengambil data.");
      return;
    }

    dataMateri=result.data || [];
    initFilters();
    hideStatus();
  };

  script.onerror=()=>{
    clearTimeout(timer);
    delete window[callback];
    script.remove();
    status("Tidak dapat menghubungi API Google Sheets.");
  };

  script.src=API_URL+"?callback="+callback;
  document.body.appendChild(script);
}

function initFilters(){
  const jenjang=unique(dataMateri.map(x=>x.jenjang));
  fill("jenjang",jenjang,"Pilih jenjang");
}

function resetListing(){
  $("listing").classList.add("hidden");
  $("reader").classList.add("hidden");
  $("list").innerHTML="";
}

function showBab(){
  const kelas=$("kelas").value;
  const mapel=$("mapel").value;

  let rows=dataMateri.filter(x=>x.jenjang===selectedJenjang);

  if(selectedJenjang.toUpperCase()==="SD"){
    if(!kelas || !mapel){
      resetListing();
      return;
    }

    rows=rows.filter(x=>
      x.kelas===kelas &&
      x.mata_pelajaran===mapel
    );
  }

  const bab=unique(rows.map(x=>x.bab));

  currentItems=bab;
  selectedView="bab";

  $("listTitle").textContent=
    selectedJenjang.toUpperCase()==="SD"
    ? "Bab Pembelajaran"
    : "Materi PAUD - KB - TK";

  $("listDesc").textContent=
    "Pilih bab untuk melihat daftar materi.";

  renderCards(bab,openBab);
}

function openBab(bab){
  selectedBab=bab;

  let rows=dataMateri.filter(x=>
    x.jenjang===selectedJenjang &&
    x.bab===bab
  );

  if(selectedJenjang.toUpperCase()==="SD"){
    rows=rows.filter(x=>
      x.kelas===$("kelas").value &&
      x.mata_pelajaran===$("mapel").value
    );
  }

  currentItems=rows;
  selectedView="materi";

  $("listTitle").textContent=bab;
  $("listDesc").textContent=
    "Pilih materi yang ingin dipelajari.";

  renderCards(
    rows.map(x=>x.judul).filter(Boolean),
    openMateri
  );
}

function renderCards(items,callback){
  $("listing").classList.remove("hidden");
  $("reader").classList.add("hidden");

  if(!items.length){
    $("list").innerHTML=
      '<div class="message">Materi belum tersedia.</div>';
    return;
  }

  $("list").innerHTML=items.map((item,i)=>`
    <button class="card" data-index="${i}">
      <strong>${esc(item)}</strong>
      <small>
        ${selectedView==="bab"?"Lihat materi →":"Buka materi →"}
      </small>
    </button>
  `).join("");

  $("list").querySelectorAll(".card").forEach((button,i)=>{
    button.addEventListener("click",()=>{
      callback(items[i]);
    });
  });
}

function openMateri(judul){
  const item=currentItems.find(x=>x.judul===judul);
  if(!item)return;

  $("listing").classList.add("hidden");
  $("reader").classList.remove("hidden");

  $("readerContent").innerHTML=`
    <h2>${esc(item.judul)}</h2>
    ${renderContent(item.link_konten)}
  `;

  $("reader").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });
}

function renderContent(value){
  const v=String(value||"").trim();

  if(!v){
    return '<div class="message">Konten belum tersedia.</div>';
  }

  const urlMatch=v.match(/https?:\/\/[^\s]+/i);

  if(!urlMatch){
    return `<p>${esc(v)}</p>`;
  }

  const url=urlMatch[0];
  const lower=url.toLowerCase();

  if(/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/.test(lower)){
    return `
      <img src="${esc(url)}"
           alt="Gambar materi"
           loading="lazy">
    `;
  }

  if(/drive\.google\.com/.test(lower)){
    const id=
      url.match(/\/d\/([^/]+)/)?.[1] ||
      url.match(/[?&]id=([^&]+)/)?.[1];

    if(id){
      return `
        <iframe
          src="https://drive.google.com/file/d/${esc(id)}/preview"
          allowfullscreen
          loading="lazy">
        </iframe>
        <p>
          <a href="${esc(url)}" target="_blank" rel="noopener">
            Buka file
          </a>
        </p>
      `;
    }
  }

  if(/youtu\.be|youtube\.com/.test(lower)){
    const id=
      url.match(/youtu\.be\/([^?&/]+)/)?.[1] ||
      url.match(/[?&]v=([^&]+)/)?.[1] ||
      url.match(/youtube\.com\/embed\/([^?&/]+)/)?.[1];

    if(id){
      return `
        <iframe
          src="https://www.youtube.com/embed/${esc(id)}"
          allowfullscreen
          loading="lazy">
        </iframe>
      `;
    }
  }

  if(/\.pdf(\?.*)?$/.test(lower)){
    return `
      <iframe src="${esc(url)}" loading="lazy"></iframe>
      <p>
        <a href="${esc(url)}" target="_blank" rel="noopener">
          Buka PDF
        </a>
      </p>
    `;
  }

  if(/\.(mp4|webm|ogg)(\?.*)?$/.test(lower)){
    return `
      <video controls playsinline src="${esc(url)}"></video>
    `;
  }

  return `
    <p>
      <a href="${esc(url)}" target="_blank" rel="noopener">
        Buka konten pembelajaran
      </a>
    </p>
  `;
}

$("jenjang").addEventListener("change",()=>{
  selectedJenjang=$("jenjang").value;

  resetListing();

  $("kelasBox").classList.add("hidden");
  $("mapelBox").classList.add("hidden");

  if(!selectedJenjang)return;

  if(selectedJenjang.toUpperCase()==="SD"){
    const rows=dataMateri.filter(x=>
      x.jenjang===selectedJenjang
    );

    fill(
      "kelas",
      unique(rows.map(x=>x.kelas)),
      "Pilih kelas"
    );

    $("kelasBox").classList.remove("hidden");

  }else{
    showBab();
  }
});

$("kelas").addEventListener("change",()=>{
  resetListing();

  const rows=dataMateri.filter(x=>
    x.jenjang===selectedJenjang &&
    x.kelas===$("kelas").value
  );

  fill(
    "mapel",
    unique(rows.map(x=>x.mata_pelajaran)),
    "Pilih mata pelajaran"
  );

  $("mapelBox").classList.remove("hidden");
});

$("mapel").addEventListener("change",showBab);

$("back").addEventListener("click",()=>{
  $("reader").classList.add("hidden");
  $("listing").classList.remove("hidden");
});

loadAPI();
</script>
</body>
</html>
