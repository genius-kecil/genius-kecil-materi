
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f4f8ff">
<title>Materi Belajar | Genius Kecil</title>
<style>
:root{--blue:#15549a;--dark:#103f76;--bg:#f4f8ff;--text:#172b45;--muted:#718096;--border:#dce6f2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.header{max-width:1120px;margin:auto;padding:10px 20px;min-height:72px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand img{width:48px;height:48px;object-fit:contain}
.brand b{display:block;color:var(--blue);font-size:20px}
.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;margin-top:3px}
.home{background:#e8f1ff;color:var(--blue);padding:11px 16px;border-radius:12px;text-decoration:none;font-weight:bold}
main{max-width:1120px;margin:auto;padding:28px 20px 60px}
h1{color:var(--blue);font-size:26px;margin:0 0 8px}
.subtitle{color:var(--muted);margin:0 0 24px}
.panel,.reader{background:#fff;border:1px solid var(--border);border-radius:17px;padding:20px;margin-bottom:24px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field label{display:block;color:var(--dark);font-size:13px;font-weight:bold;margin-bottom:8px}
select{width:100%;height:48px;border:1px solid var(--border);border-radius:13px;background:#fbfdff;padding:0 13px;color:var(--text);font-size:14px}
select:focus{outline:2px solid #b9d6fa}
.section-title{color:var(--blue);font-size:20px;margin:28px 0 7px}
.desc{font-size:13px;color:var(--muted);margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.card{border:1px solid var(--border);background:#fff;border-radius:14px;padding:17px;text-align:left;cursor:pointer;min-height:85px}
.card:hover{border-color:#7eafe7}
.card strong{display:block;color:var(--dark);font-size:15px;line-height:1.5}
.card small{display:block;color:var(--muted);margin-top:6px;line-height:1.4}
.reader-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.reader-title{color:var(--blue);font-size:22px;line-height:1.35;font-weight:700;margin:0;min-width:0;overflow-wrap:anywhere}
.reader-actions{display:flex;align-items:center;gap:9px;flex-shrink:0}
.icon-button{width:43px;height:43px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:12px;background:#f3f7ff;color:var(--blue);cursor:pointer}
.icon-button:hover{background:#e5efff}
.icon-button:disabled{opacity:.5;cursor:wait}
.icon-button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.download-status{color:var(--muted);font-size:12px;margin:0 0 12px;min-height:16px}
.content{line-height:1.8;overflow-wrap:anywhere}
.content img{max-width:100%;height:auto;border-radius:10px;display:block;margin:auto}
.content iframe{display:block;width:100%;height:650px;border:1px solid var(--border);border-radius:10px;background:#fff}
.content video{display:block;width:100%;max-height:550px;border-radius:10px;background:#111}
.text-content{background:#f8faff;border:1px solid var(--border);border-radius:12px;padding:20px;white-space:pre-wrap;line-height:1.8}
.message{background:#fff;border:1px dashed #b9cce2;border-radius:13px;padding:22px;text-align:center;color:var(--muted);line-height:1.6}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:12px;padding:22px}
@media(max-width:700px){
.header{padding:9px 14px}.brand img{width:42px;height:42px}.brand b{font-size:17px}
.home{font-size:13px;padding:9px 12px}
main{padding:22px 15px 45px}h1{font-size:23px}
.fields,.grid{grid-template-columns:1fr}.panel{padding:16px}
.reader{padding:17px}.reader-toolbar{gap:8px;margin-bottom:19px}
.reader-title{font-size:20px}.reader-actions{gap:7px}
.icon-button{width:41px;height:41px;border-radius:11px}
.content iframe{height:520px}
}
</style>
</head>
<body>
<header>
 <div class="header">
  <a class="brand" href="./">
   <img src="https://raw.githubusercontent.com/genius-kecil/genius-kecil-portal/main/logo-genius-kecil.png" alt="Genius Kecil">
   <span><b>GENIUS KECIL</b><small>TEMAN BELAJAR KITA</small></span>
  </a>
  <a class="home" href="https://genius-kecil-portal.rt2000-innovation.workers.dev/">Beranda</a>
 </div>
</header>

<main>
 <h1>Materi Pembelajaran</h1>
 <p class="subtitle">Yuk, pilih jenjang pendidikan dan mulai belajar!</p>

 <section class="panel">
  <div class="fields">
   <div class="field">
    <label for="jenjang">Jenjang Pendidikan</label>
    <select id="jenjang"><option value="">Memuat jenjang...</option></select>
   </div>
   <div class="field hidden" id="kelasBox">
    <label for="kelas">Kelas</label>
    <select id="kelas"><option value="">Pilih kelas</option></select>
   </div>
   <div class="field hidden" id="mapelBox">
    <label for="mapel">Mata Pelajaran</label>
    <select id="mapel"><option value="">Pilih mata pelajaran</option></select>
   </div>
  </div>
 </section>

 <section id="listing" class="hidden">
  <h2 class="section-title" id="listTitle">Daftar Materi</h2>
  <p class="desc" id="listDesc"></p>
  <div id="list" class="grid"></div>
 </section>

 <section id="reader" class="panel hidden">
  <div class="reader-toolbar">
   <h2 class="reader-title" id="readerTitle"></h2>
   <div class="reader-actions">
    <button class="icon-button" id="back" title="Kembali" aria-label="Kembali">
     <svg viewBox="0 0 24 24"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
    </button>
    <button class="icon-button" id="download" title="Download" aria-label="Download">
     <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path><path d="M12 15V3"></path></svg>
    </button>
   </div>
  </div>
  <p class="download-status" id="downloadStatus"></p>
  <div id="readerContent" class="content"></div>
 </section>

 <div id="status" class="message">Menghubungkan ke database materi...</div>
</main>

<footer>Genius Kecil · Teman Belajar Kita</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxB8_JF6PrDj0TLbOff1VYLtfvTQ7w6Pf_xDY8JszolRviRljgNJPcZ9AJPPGZDEQZBXg/exec";
const $=id=>document.getElementById(id);

let dataMateri=[];
let currentItems=[];
let selectedJenjang="";
let selectedView="bab";
let currentContentUrl="";
let currentContentType="";

function esc(value){
 return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function isSD(value){
 const v=String(value||"").trim().toUpperCase();
 return v==="SD"||v.includes("SEKOLAH DASAR");
}
function status(message){
 $("status").textContent=message;
 $("status").classList.remove("hidden");
}
function hideStatus(){ $("status").classList.add("hidden"); }
function unique(values){
 return [...new Set(values.map(v=>String(v||"").trim()).filter(Boolean))];
}
function fill(id,values,placeholder){
 const el=$(id);
 el.innerHTML="";
 const first=document.createElement("option");
 first.value="";
 first.textContent=placeholder;
 el.appendChild(first);
 values.forEach(value=>{
  const op=document.createElement("option");
  op.value=value;
  op.textContent=value;
  el.appendChild(op);
 });
}
function loadAPI(){
 const callback="gkData_"+Date.now();
 const script=document.createElement("script");
 const timer=setTimeout(()=>{
  delete window[callback];script.remove();
  status("Koneksi database terlalu lama. Silakan muat ulang halaman.");
 },20000);
 window[callback]=result=>{
  clearTimeout(timer);delete window[callback];script.remove();
  if(!result||result.status!=="success"){
   status(result?.message||"Gagal mengambil data.");return;
  }
  dataMateri=result.data||[];
  initFilters();hideStatus();
 };
 script.onerror=()=>{
  clearTimeout(timer);delete window[callback];script.remove();
  status("Tidak dapat menghubungi API Google Sheets.");
 };
 script.src=API_URL+"?callback="+callback;
 document.body.appendChild(script);
}
function initFilters(){
 fill("jenjang",unique(dataMateri.map(x=>x.jenjang)),"Pilih jenjang");
}
function resetListing(){
 $("listing").classList.add("hidden");
 $("reader").classList.add("hidden");
 $("list").innerHTML="";
}
function showBab(){
 const kelas=$("kelas").value,mapel=$("mapel").value;
 let rows=dataMateri.filter(x=>x.jenjang===selectedJenjang);
 if(isSD(selectedJenjang)){
  if(!kelas||!mapel){resetListing();return;}
  rows=rows.filter(x=>x.kelas===kelas&&x.mata_pelajaran===mapel);
 }
 const bab=unique(rows.map(x=>x.bab));
 currentItems=bab;selectedView="bab";
 $("listTitle").textContent=isSD(selectedJenjang)?"Bab Pembelajaran":"Materi PAUD - KB - TK";
 $("listDesc").textContent="Pilih bab untuk melihat daftar materi.";
 renderCards(bab,openBab);
}
function openBab(bab){
 let rows=dataMateri.filter(x=>x.jenjang===selectedJenjang&&x.bab===bab);
 if(isSD(selectedJenjang)){
  rows=rows.filter(x=>x.kelas===$("kelas").value&&x.mata_pelajaran===$("mapel").value);
 }
 currentItems=rows;selectedView="materi";
 $("listTitle").textContent=bab;
 $("listDesc").textContent="Pilih materi yang ingin dipelajari.";
 renderCards(rows.map(x=>x.judul).filter(Boolean),openMateri);
}
function renderCards(items,callback){
 $("listing").classList.remove("hidden");
 $("reader").classList.add("hidden");
 if(!items.length){
  $("list").innerHTML='<div class="message">Materi belum tersedia.</div>';return;
 }
 $("list").innerHTML=items.map(item=>`
  <button class="card"><strong>${esc(item)}</strong>
  <small>${selectedView==="bab"?"Lihat materi →":"Buka materi →"}</small></button>
 `).join("");
 $("list").querySelectorAll(".card").forEach((button,i)=>{
  button.addEventListener("click",()=>callback(items[i]));
 });
}
function openMateri(judul){
 const item=currentItems.find(x=>x.judul===judul);
 if(!item)return;
 currentContentUrl=String(item.link_konten||"").trim();
 $("listing").classList.add("hidden");
 $("reader").classList.remove("hidden");
 $("readerTitle").textContent=item.judul;
 $("downloadStatus").textContent="";
 $("readerContent").innerHTML=renderContent(currentContentUrl);
 $("reader").scrollIntoView({behavior:"smooth",block:"start"});
}
function driveId(url){
 return url.match(/\/d\/([^/]+)/)?.[1]||url.match(/[?&]id=([^&]+)/)?.[1]||"";
}
function renderContent(value){
 const v=String(value||"").trim();
 if(!v){currentContentType="text";return '<div class="message">Konten belum tersedia.</div>';}
 if(!/^https?:\/\//i.test(v)){
  currentContentType="text";
  return `<div class="text-content">${esc(v)}</div>`;
 }
 const lower=v.toLowerCase();
 currentContentUrl=v;

 if(/\.(jpg|jpeg|png|gif|webp)(\?.*)?$/.test(lower)){
  currentContentType="image";
  return `<img src="${esc(v)}" alt="Gambar materi" loading="lazy">`;
 }
 let m=v.match(/docs\.google\.com\/document\/d\/([^/]+)/);
 if(m){currentContentType="google-doc";return `<iframe src="https://docs.google.com/document/d/${esc(m[1])}/preview" loading="lazy"></iframe>`;}
 m=v.match(/docs\.google\.com\/presentation\/d\/([^/]+)/);
 if(m){currentContentType="google-slides";return `<iframe src="https://docs.google.com/presentation/d/${esc(m[1])}/embed" loading="lazy"></iframe>`;}
 m=v.match(/docs\.google\.com\/spreadsheets\/d\/([^/]+)/);
 if(m){currentContentType="google-sheet";return `<iframe src="https://docs.google.com/spreadsheets/d/${esc(m[1])}/preview" loading="lazy"></iframe>`;}
 if(/drive\.google\.com/.test(lower)){
  const id=driveId(v);
  if(id){
   currentContentType="google-drive";
   return `<iframe src="https://drive.google.com/file/d/${esc(id)}/preview" loading="lazy" allowfullscreen></iframe>`;
  }
 }
 if(/youtu\.be|youtube\.com/.test(lower)){
  const id=v.match(/youtu\.be\/([^?&/]+)/)?.[1]||v.match(/[?&]v=([^&]+)/)?.[1]||v.match(/youtube\.com\/embed\/([^?&/]+)/)?.[1];
  if(id){currentContentType="youtube";return `<iframe src="https://www.youtube.com/embed/${esc(id)}" allowfullscreen loading="lazy"></iframe>`;}
 }
 if(/\.(mp4|webm|ogg)(\?.*)?$/.test(lower)){
  currentContentType="video";
  return `<video controls playsinline src="${esc(v)}"></video>`;
 }
 currentContentType="document";
 return `<iframe src="${esc(v)}" loading="lazy" allowfullscreen></iframe>`;
}

// Unduh file Drive secara langsung menggunakan endpoint download.
function downloadUrl(){
 const url=currentContentUrl;
 const type=currentContentType;

 if(!url)return "";

 if(type==="google-doc"){
  const id=url.match(/\/document\/d\/([^/]+)/)?.[1];
  return id?"https://docs.google.com/document/d/"+id+"/export?format=pdf":"";
 }
 if(type==="google-slides"){
  const id=url.match(/\/presentation\/d\/([^/]+)/)?.[1];
  return id?"https://docs.google.com/presentation/d/"+id+"/export/pdf":"";
 }
 if(type==="google-sheet"){
  const id=url.match(/\/spreadsheets\/d\/([^/]+)/)?.[1];
  return id?"https://docs.google.com/spreadsheets/d/"+id+"/export?format=pdf":"";
 }
 if(type==="google-drive"){
  const id=driveId(url);
  return id?"https://drive.google.com/uc?export=download&id="+id:"";
 }
 return url;
}

async function downloadContent(){
 const url=downloadUrl();
 if(!url){
  $("downloadStatus").textContent="Konten belum tersedia untuk diunduh.";
  return;
 }

 const button=$("download");
 button.disabled=true;
 $("downloadStatus").textContent="Menyiapkan unduhan...";

 // Teks: buat file TXT langsung.
 if(currentContentType==="text"){
  const blob=new Blob([$("readerContent").innerText],{type:"text/plain;charset=utf-8"});
  const objectUrl=URL.createObjectURL(blob);
  triggerDownload(objectUrl,"materi-genius-kecil.txt");
  setTimeout(()=>URL.revokeObjectURL(objectUrl),5000);
  $("downloadStatus").textContent="Download dimulai.";
  button.disabled=false;
  return;
 }

 // Untuk file lintas domain, gunakan navigasi langsung ke endpoint download.
 // Browser akan mengelola unduhan sesuai izin dan pengaturannya.
 const a=document.createElement("a");
 a.href=url;
 a.target="_blank";
 a.rel="noopener";
 a.download="";
 document.body.appendChild(a);
 a.click();
 a.remove();

 $("downloadStatus").textContent=
  "Permintaan download dikirim. Jika file terbuka, gunakan menu download browser.";

 setTimeout(()=>{button.disabled=false;},1200);
}

function triggerDownload(url,filename){
 const a=document.createElement("a");
 a.href=url;a.download=filename;
 document.body.appendChild(a);a.click();a.remove();
}

$("jenjang").addEventListener("change",()=>{
 selectedJenjang=$("jenjang").value;
 resetListing();
 $("kelasBox").classList.add("hidden");
 $("mapelBox").classList.add("hidden");
 if(!selectedJenjang)return;

 if(isSD(selectedJenjang)){
  const rows=dataMateri.filter(x=>x.jenjang===selectedJenjang);
  fill("kelas",unique(rows.map(x=>x.kelas)),"Pilih kelas");
  $("kelasBox").classList.remove("hidden");
 }else{
  showBab();
 }
});
$("kelas").addEventListener("change",()=>{
 resetListing();
 const rows=dataMateri.filter(x=>x.jenjang===selectedJenjang&&x.kelas===$("kelas").value);
 fill("mapel",unique(rows.map(x=>x.mata_pelajaran)),"Pilih mata pelajaran");
 $("mapelBox").classList.remove("hidden");
});
$("mapel").addEventListener("change",showBab);
$("back").addEventListener("click",()=>{
 $("reader").classList.add("hidden");
 $("listing").classList.remove("hidden");
});
$("download").addEventListener("click",downloadContent);

loadAPI();
</script>
</body>
</html>
